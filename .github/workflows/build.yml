
name: Construir APK de Alisa

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake \
            libltdl-dev

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer setuptools "Cython==0.29.34"

      - name: Construir APK
        run: |
          yes | buildozer android debug

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Alisa-APK
          path: bin/*.apk

      - name: Guardar registros
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Alisa-logs
          path: .buildozer/**/*.log
          if-no-files-found: ignore
